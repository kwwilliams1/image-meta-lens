[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imgmeta"
version = "0.1.0"
description = "Read basic metadata (dimensions, EXIF, PNG text chunks) from image files, standard library only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "kwwilliams1" }]

[tool.setuptools.packages.find]
include = ["imgmeta*"]
